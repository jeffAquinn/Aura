[project]
name = "aura"
version = "0.1.0"
description = "Aura: a local AI agent living on a Mac mini"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
aura = "aura.main:main"
aura-server = "aura.server:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
