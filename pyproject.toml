[project]
name = "aura"
version = "0.1.0"
description = "Aura: a local AI agent living on a Mac mini"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
aura = "aura.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
