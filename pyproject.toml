[project]
name = "aura"
version = "0.1.0"
description = "Aura: a local AI agent living on a Mac mini"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "en-core-web-sm",
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.6.7",
    "python-dotenv>=1.2.4",
    "soundfile>=0.14.0",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
aura = "aura.main:main"
aura-server = "aura.server:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
